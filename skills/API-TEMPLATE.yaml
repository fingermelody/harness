# API Spec 模板 (OpenAPI 3.0)

> 复制此模板到 `docs/api/<feature-id>.yaml` 填写

```yaml
openapi: "3.0.3"
info:
  title: "WebHarness API - <Feature Name>"
  description: "<功能描述>"
  version: "1.0.0"
  contact:
    name: "WebHarness Team"

servers:
  - url: http://localhost:3000/api/v1
    description: 本地开发
  - url: https://test-staging.myapp.com/api/v1
    description: 测试环境
  - url: https://myapp.com/api/v1
    description: 生产环境

tags:
  - name: "<Resource>"
    description: "<资源说明>"

paths:
  # ========== GET 列表 ==========
  "/<resource>":
    get:
      tags: ["<Resource>"]
      summary: "获取<资源>列表"
      operationId: "list<Resources>"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, updated_at, name]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>ListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # ========== GET 详情 ==========
  "/<resource>/{id}":
    get:
      tags: ["<Resource>"]
      summary: "获取<资源>详情"
      operationId: "get<Resource>"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        "404":
          $ref: '#/components/responses/NotFound'

  # ========== POST 创建 ==========
  "/<resource>":
    post:
      tags: ["<Resource>"]
      summary: "创建<资源>"
      operationId: "create<Resource>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create<Resource>Request'
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        "400":
          $ref: '#/components/responses/BadRequest'
        "422":
          $ref: '#/components/responses/ValidationError'

  # ========== PUT 更新 ==========
  "/<resource>/{id}":
    put:
      tags: ["<Resource>"]
      summary: "更新<资源>"
      operationId: "update<Resource>"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update<Resource>Request'
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        "404":
          $ref: '#/components/responses/NotFound'

  # ========== DELETE 删除 ==========
  "/<resource>/{id}":
    delete:
      tags: ["<Resource>"]
      summary: "删除<资源>"
      operationId: "delete<Resource>"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功
        "404":
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    # ====== 数据模型 ======
    <Resource>:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, created_at, updated_at]

    <Resource>ListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/<Resource>'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Create<Resource>Request:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required: [name]

    Update<Resource>Request:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: 数据验证失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  Error:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
      details:
        type: object
    required: [code, message]

  ValidationError:
    type: object
    properties:
      code:
        type: string
        value: validation_error
      message:
        type: string
      errors:
        type: array
        items:
          type: object
          properties:
            field:
              type: string
            message:
              type: string
    required: [code, message, errors]
```

## 使用指南

### 填写步骤

1. 替换所有 `<Resource>` 为实际资源名（单数形式，如 User, Task）
2. 补充字段定义和业务规则
3. 根据实际需求增删端点
4. 更新错误码和响应格式

### 验证

```bash
# 使用 swagger-cli 验证
npx swagger-cli validate docs/api/<feature>.yaml
```